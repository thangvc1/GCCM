spring.config.import=optional:file:.env

# ==================== SERVER CONFIGURATION ====================
spring.application.name=gccm-backend
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT:8080}
server.version=${SERVER_VERSION:1.0.0}
allowed.origin=${ALLOWED_ORIGIN:http://localhost:3000}

# ==================== FRONTEND INFORMATION ====================
frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==================== TOMCAT CONFIGURATION ====================
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20

# ==================== DATABASE CONFIGURATION ====================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gccm}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==================== JPA CONFIGURATION ====================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.format_sql=true

# ==================== SECURITY CONFIGURATION ====================
jwt.secret=${JWT_SECRET:default_secret_key_needs_to_be_replaced_in_env}

# ==================== MAIL CONFIGURATION ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ==================== CLOUDINARY CONFIGURATION ====================
cloudinary.cloud-name=${CLOUD_NAME:rckn856k}
cloudinary.api-key=${CLOUD_API_KEY:926368256833564}
cloudinary.api-secret=${CLOUD_API_SECRET:e17e-PJjNC41530XkuDJA2uCjyg}