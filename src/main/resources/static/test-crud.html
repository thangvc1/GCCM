<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GCCM - Hệ Thống Đặt Hàng & Quản Lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-center">Hệ Thống Thảm Bê Tông (GCCM)</h2>

    <!-- Vùng Đăng nhập -->
    <div id="loginSection" class="card p-4 mb-4 mx-auto shadow-sm" style="max-width: 400px;">
        <h4 class="text-center mb-3">Đăng nhập</h4>
        <input type="text" id="username" class="form-control mb-3" placeholder="Tên đăng nhập">
        <input type="password" id="password" class="form-control mb-3" placeholder="Mật khẩu">
        <button class="btn btn-primary w-100 mb-2" onclick="login()">Đăng nhập</button>
        <button class="btn btn-outline-secondary w-100" onclick="registerModalObj.show()">Chưa có tài khoản? Đăng ký ngay</button>
        <div id="loginMsg" class="text-danger mt-2 text-center"></div>
    </div>

    <!-- Nút Đăng xuất chung -->
    <div id="logoutBtnArea" class="hidden d-flex justify-content-end mb-3">
        <button class="btn btn-danger shadow-sm" onclick="logout()">Đăng xuất</button>
    </div>

    <!-- GIAO DIỆN ADMIN -->
    <div id="adminSection" class="hidden">
        <h4>Trang Quản Trị Viên</h4>
        <table class="table table-bordered bg-white mt-3 shadow-sm">
            <thead class="table-dark">
            <tr><th>ID</th><th>Tên SP</th><th>Giá bán</th><th>Trạng thái</th></tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
        <!-- Các Modal Thêm/Sửa Admin (Có thể mở rộng sau dựa trên code cũ) -->
    </div>

    <!-- GIAO DIỆN KHÁCH HÀNG (ĐẶT HÀNG) -->
    <div id="customerSection" class="hidden">
        <h4>Danh sách Sản phẩm</h4>
        <div class="row" id="productStore"></div>

        <div class="card p-4 mt-4 bg-light border-primary shadow-sm">
            <h5>Gửi Yêu Cầu Tư Vấn / Đặt Hàng</h5>
            <div class="mb-3">
                <label>Ghi chú cho Sales:</label>
                <textarea id="customerNote" class="form-control" rows="2" placeholder="Ví dụ: Gọi cho tôi vào buổi chiều..."></textarea>
            </div>
            <button class="btn btn-success btn-lg w-100" onclick="submitOrder()">Xác Nhận Gửi Yêu Cầu</button>
        </div>
    </div>
</div>

<!-- Modal Đăng Ký Tài Khoản -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Đăng Ký Tài Khoản Khách Hàng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" id="regUsername" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" id="regPassword" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" id="regFullName" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                    <input type="text" id="regPhone" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" id="regAddress" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" onclick="register()">Xác nhận Đăng ký</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api";
    let jwtToken = localStorage.getItem("jwtToken");
    let currentRole = localStorage.getItem("role");
    let registerModalObj = null;

    document.addEventListener("DOMContentLoaded", function() {
        registerModalObj = new bootstrap.Modal(document.getElementById('registerModal'));
        if (jwtToken && currentRole) {
            routeUser(currentRole);
        }
    });

    async function login() {
        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            const data = await res.json();
            jwtToken = data.token;
            currentRole = data.role;
            localStorage.setItem("jwtToken", jwtToken);
            localStorage.setItem("role", currentRole);
            routeUser(currentRole);
        } else {
            document.getElementById('loginMsg').innerText = "Sai thông tin đăng nhập!";
        }
    }

    async function register() {
        const payload = {
            username: document.getElementById('regUsername').value,
            password: document.getElementById('regPassword').value,
            fullName: document.getElementById('regFullName').value,
            phone: document.getElementById('regPhone').value,
            address: document.getElementById('regAddress').value
        };

        if (!payload.username || !payload.password || !payload.fullName || !payload.phone) {
            alert("Vui lòng nhập đầy đủ các trường bắt buộc (*)");
            return;
        }

        const res = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Đăng ký thành công! Bạn có thể đăng nhập ngay bây giờ.");
            registerModalObj.hide();
            // Điền sẵn username vừa đăng ký vào ô đăng nhập cho tiện
            document.getElementById('username').value = payload.username;
            document.getElementById('password').value = "";
        } else {
            const errorMsg = await res.text();
            alert("Đăng ký thất bại: " + errorMsg);
        }
    }

    function routeUser(role) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('logoutBtnArea').classList.remove('hidden');

        if (role === 'ROLE_ADMIN') {
            document.getElementById('adminSection').classList.remove('hidden');
            loadAdminProducts();
        } else if (role === 'ROLE_CUSTOMER') {
            document.getElementById('customerSection').classList.remove('hidden');
            loadCustomerProducts();
        }
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    function getAuthHeaders() {
        return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwtToken };
    }

    // --- LOGIC CUSTOMER ---
    let storeProducts = [];

    async function loadCustomerProducts() {
        const res = await fetch(`${API_BASE}/admin/products`, { headers: getAuthHeaders() });
        storeProducts = await res.json();

        const store = document.getElementById('productStore');
        store.innerHTML = "";
        storeProducts.filter(p => p.status === 1).forEach(p => {
            store.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${p.name}</h5>
                            <p class="card-text mb-4">Độ dày: ${p.thicknessMm}mm<br>Giá: <b class="text-danger">${p.unitPrice.toLocaleString('vi-VN')} đ/m²</b></p>
                            <input type="number" id="qty_${p.id}" class="form-control mt-auto mb-2" placeholder="Nhập số m² cần mua">
                        </div>
                    </div>
                </div>`;
        });
    }

    async function submitOrder() {
        const items = [];
        storeProducts.filter(p => p.status === 1).forEach(p => {
            const qtyInput = document.getElementById(`qty_${p.id}`).value;
            if (qtyInput && parseFloat(qtyInput) > 0) {
                items.push({ productId: p.id, quantityM2: parseFloat(qtyInput) });
            }
        });

        if (items.length === 0) {
            alert("Vui lòng nhập số lượng cho ít nhất 1 sản phẩm!");
            return;
        }

        const payload = {
            customerNote: document.getElementById('customerNote').value,
            items: items
        };

        const res = await fetch(`${API_BASE}/customer/orders`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Đã gửi yêu cầu đặt hàng thành công! Sales sẽ liên hệ sớm.");
            location.reload();
        } else {
            alert("Có lỗi xảy ra khi đặt hàng. Vui lòng thử lại.");
        }
    }

    // --- LOGIC ADMIN ---
    async function loadAdminProducts() {
        const res = await fetch(`${API_BASE}/admin/products`, { headers: getAuthHeaders() });
        const products = await res.json();
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = "";
        products.forEach(p => {
            tbody.innerHTML += `<tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.unitPrice.toLocaleString('vi-VN')} đ</td>
                <td>${p.status === 1 ? '<span class="badge bg-success">Đang bán</span>' : '<span class="badge bg-danger">Ngừng bán</span>'}</td>
            </tr>`;
        });
    }
</script>

</body>
</html>
